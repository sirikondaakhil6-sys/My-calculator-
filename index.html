<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4B0082" id="themeColor">
  <title>VIBGYOR Calculator</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <button id="menuBtn" class="icon-btn" aria-label="Open settings">☰</button>
      <h1>Calculator</h1>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode">☀</button>
    </header>

    <aside id="drawer" class="drawer" aria-hidden="true">
      <div class="drawer-head">
        <h2>Settings</h2>
        <button id="closeMenu" class="icon-btn">✕</button>
      </div>

      <section>
        <h3>VIBGYOR Theme</h3>
        <div class="colors">
          <button class="color violet" data-color="#8F00FF" title="Violet"></button>
          <button class="color indigo" data-color="#4B0082" title="Indigo"></button>
          <button class="color blue" data-color="#1976D2" title="Blue"></button>
          <button class="color green" data-color="#16A34A" title="Green"></button>
          <button class="color yellow" data-color="#D97706" title="Yellow"></button>
          <button class="color orange" data-color="#EA580C" title="Orange"></button>
          <button class="color red" data-color="#DC2626" title="Red"></button>
        </div>
      </section>

      <section>
        <h3>Appearance</h3>
        <button id="modeBtn" class="setting-btn">🌙 Dark Mode</button>
      </section>

      <section>
        <h3>Calculator Size</h3>
        <div class="size-options">
          <button data-size="small">Small</button>
          <button data-size="medium" class="active">Medium</button>
          <button data-size="large">Large</button>
        </div>
      </section>
    </aside>
    <div id="overlay"></div>

    <main>
      <div class="display">
        <div id="history"></div>
        <div id="screen">0</div>
      </div>

      <div class="keys">
        <button class="special" data-action="clear">AC</button>
        <button class="special" data-action="delete">⌫</button>
        <button class="operator" data-value="%">%</button>
        <button class="operator" data-value="/">÷</button>

        <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button>
        <button class="operator" data-value="*">×</button>

        <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button>
        <button class="operator" data-value="-">−</button>

        <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button>
        <button class="operator" data-value="+">+</button>

        <button data-action="sign">±</button><button data-value="0">0</button><button data-value=".">.</button>
        <button class="equals" data-action="equals">=</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
